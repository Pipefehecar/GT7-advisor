http:
  method: post
  url: "{{api_url}}/sessions/"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "car_id": 301,
        "track_name": "Suzuka, full circuit",
        "manual_config": {
          "ride_height_front": 60,
          "ride_height_rear": 70,
          "arb_front": 5,
          "arb_rear": 5,
          "damper_bump_front": 25,
