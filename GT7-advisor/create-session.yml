          "damper_rebound_rear": 45,
          "downforce_front": 400,
          "downforce_rear": 600,
          "front_bias": 0
        }
      }
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5

